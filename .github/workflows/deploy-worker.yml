name: Deploy Worker
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy and verify
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -e

          METADATA='{"main_module":"worker.js","compatibility_date":"2024-01-01","keep_bindings": ["secret_text", "secret_key"],"bindings":[{"type":"kv_namespace","name":"TRIALS","namespace_id":"aa82281c363b4843b928d35f96d152c2"}]}'
          DEPLOY=$(curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/iptv-trial-mojo4ktv" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -F "metadata=${METADATA};type=application/json" \
            -F "worker.js=@worker/worker.js;type=application/javascript+module")
          echo "$DEPLOY" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0) if d.get('success') else (print('Deploy error:',d.get('errors')) or exit(1))"

          # Secrets (RESEND_KEY, PANEL_API_KEY) are set on the Worker in Cloudflare and kept across deploys (keep_bindings).

          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/iptv-trial-mojo4ktv/subdomain" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"enabled":true}'

          echo "Deploy complete."
