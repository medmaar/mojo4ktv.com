name: Write diagnose output
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run diagnostics and save output
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          {
            echo "=== POST to worker ==="
            curl -s -X POST "https://iptv-trial-mojo4ktv.medmaar.workers.dev" \
              -H "Content-Type: application/json" \
              -d '{"name":"Test","email":"test@test.com","country":"Canada","whatsapp":"","device":"","notes":""}' || echo "CURL FAILED"

            echo ""
            echo "=== List workers ==="
            curl -s "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:',d.get('success')); [print(' -',s['id']) for s in d.get('result',[])]"

            echo ""
            echo "=== Subdomain status ==="
            curl -s "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/iptv-trial-mojo4ktv/subdomain" \
              -H "Authorization: Bearer ${CF_TOKEN}"

            echo ""
            echo "=== Secrets ==="
            curl -s "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/iptv-trial-mojo4ktv/secrets" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:',d.get('success')); [print(' -',s['name']) for s in d.get('result',[])]"
          } > diag-output.txt 2>&1

      - name: Commit output
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add diag-output.txt
          git commit -m "diag output" || echo "no changes"
          git push
