name: Deep diagnose mojo4ktv
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test POST to worker (what the form actually sends)
        run: |
          echo "=== POST response ==="
          curl -s -o /tmp/post.txt -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "https://iptv-trial-mojo4ktv.medmaar.workers.dev" \
            -H "Content-Type: application/json" \
            -d '{"name":"Test","email":"test@test.com","country":"Canada","whatsapp":"","device":"","notes":""}'
          echo ""
          cat /tmp/post.txt

      - name: Check CORS preflight (OPTIONS)
        run: |
          echo "=== OPTIONS response headers ==="
          curl -si -X OPTIONS "https://iptv-trial-mojo4ktv.medmaar.workers.dev" \
            -H "Origin: https://mojo4ktv.com" \
            -H "Access-Control-Request-Method: POST" | head -20

      - name: List all CF workers (correct endpoint)
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "=== All workers in account ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:',d.get('success')); [print(' -',s['id']) for s in d.get('result',[])]"

      - name: Check subdomain
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "=== workers.dev subdomain ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/iptv-trial-mojo4ktv/subdomain" \
            -H "Authorization: Bearer ${CF_TOKEN}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d,indent=2))" || echo "parse error"

      - name: Force enable subdomain and check secrets
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "=== Force enable subdomain ==="
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/iptv-trial-mojo4ktv/subdomain" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            -d '{"enabled":true}' | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d,indent=2))" || echo "parse error"
          echo "=== Secrets ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/iptv-trial-mojo4ktv/secrets" \
            -H "Authorization: Bearer ${CF_TOKEN}" | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:',d.get('success')); [print(' -',s['name']) for s in d.get('result',[])]" || echo "parse error"
