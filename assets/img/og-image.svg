<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a35"/>
      <stop offset="100%" style="stop-color:#0d2040"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#E74F51;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#E74F51;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Glow overlay -->
  <ellipse cx="600" cy="150" rx="500" ry="200" fill="url(#glow)"/>
  <!-- Brand mark -->
  <text x="600" y="220" font-family="Arial Black, Arial, sans-serif" font-size="88" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="-3">Mojo<tspan fill="#E74F51">4K</tspan>TV</text>
  <!-- Tagline -->
  <text x="600" y="295" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="rgba(255,255,255,0.7)" letter-spacing="1">BEST IPTV SERVICE 2026</text>
  <!-- Divider -->
  <line x1="400" y1="325" x2="800" y2="325" stroke="#E74F51" stroke-width="1.5" opacity="0.4"/>
  <!-- Stats row -->
  <text x="240" y="400" font-family="Arial Black, Arial, sans-serif" font-size="42" font-weight="900" text-anchor="middle" fill="#E74F51">50K+</text>
  <text x="240" y="430" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="rgba(255,255,255,0.55)" letter-spacing="1">LIVE CHANNELS</text>
  <text x="480" y="400" font-family="Arial Black, Arial, sans-serif" font-size="42" font-weight="900" text-anchor="middle" fill="#E74F51">4K</text>
  <text x="480" y="430" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="rgba(255,255,255,0.55)" letter-spacing="1">ULTRA HD</text>
  <text x="720" y="400" font-family="Arial Black, Arial, sans-serif" font-size="42" font-weight="900" text-anchor="middle" fill="#E74F51">$9</text>
  <text x="720" y="430" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="rgba(255,255,255,0.55)" letter-spacing="1">FROM /MONTH</text>
  <text x="960" y="400" font-family="Arial Black, Arial, sans-serif" font-size="42" font-weight="900" text-anchor="middle" fill="#E74F51">FREE</text>
  <text x="960" y="430" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="rgba(255,255,255,0.55)" letter-spacing="1">24H TRIAL</text>
  <!-- URL -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="rgba(255,255,255,0.35)" letter-spacing="2">mojo4ktv.com</text>
</svg>